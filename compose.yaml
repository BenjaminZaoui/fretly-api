# Environnement de développement : API + PostgreSQL
# Prérequis : cp .env.dist .env
# Lancement : docker compose up --build
# (optionnel) commit dans /version : GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up --build

services:
  db:
    image: postgres:18.6-alpine3.24
    env_file: .env
    volumes:
      # PostgreSQL 18 : les données sont dans /var/lib/postgresql/<version>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    env_file: .env
    environment:
      # Dans Compose, l'hôte de la base est le nom du service : db
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
